<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PRISMA — Iniciar sesión</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-page">
    <div class="card auth-card">
      <div class="auth-logo">
        <div class="dot" style="width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--accent-cian),var(--accent-violeta));margin:0 auto 14px;"></div>
        <h1>PRISMA</h1>
        <p>Tu día, priorizado.</p>
      </div>

      <div id="auth-error" class="auth-error hidden"></div>

      <form id="form-login">
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" required autocomplete="email" placeholder="tu@empresa.com" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" />
        </div>
        <div class="field hidden" id="campo-nombre">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" placeholder="Tu nombre" />
        </div>
        <p class="hidden" id="nota-invitacion" style="color:var(--text-muted); font-size:12px; margin:-8px 0 16px;">
          Solo puedes crear tu cuenta si un administrador ya te invitó con tu correo.
        </p>
        <button type="submit" class="btn btn-primary" style="width:100%" id="btn-submit">Iniciar sesión</button>
      </form>

      <div class="auth-switch">
        <span id="switch-texto">¿No tienes cuenta?</span>
        <a href="#" id="switch-link">Regístrate</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { iniciarSesion, registrarUsuario, obtenerPerfil } from './js/auth.js';
    import { toast } from './js/ui.js';

    const form = document.getElementById('form-login');
    const btnSubmit = document.getElementById('btn-submit');
    const switchLink = document.getElementById('switch-link');
    const switchTexto = document.getElementById('switch-texto');
    const campoNombre = document.getElementById('campo-nombre');
    const authError = document.getElementById('auth-error');
    let modoRegistro = false;

    // Si ya hay sesión activa, entra directo
    obtenerPerfil().then(perfil => {
      if (perfil) window.location.href = 'app/mi-dia.html';
    });

    switchLink.addEventListener('click', (e) => {
      e.preventDefault();
      modoRegistro = !modoRegistro;
      campoNombre.classList.toggle('hidden', !modoRegistro);
      document.getElementById('nota-invitacion').classList.toggle('hidden', !modoRegistro);
      document.getElementById('nombre').required = modoRegistro;
      btnSubmit.textContent = modoRegistro ? 'Crear cuenta' : 'Iniciar sesión';
      switchTexto.textContent = modoRegistro ? '¿Ya tienes cuenta?' : '¿No tienes cuenta?';
      switchLink.textContent = modoRegistro ? 'Inicia sesión' : 'Regístrate';
      authError.classList.add('hidden');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      authError.classList.add('hidden');
      btnSubmit.disabled = true;
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const nombre = document.getElementById('nombre').value.trim();

      try {
        const { error } = modoRegistro
          ? await registrarUsuario(email, password, nombre)
          : await iniciarSesion(email, password);

        if (error) {
          authError.textContent = error.message;
          authError.classList.remove('hidden');
          return;
        }

        if (modoRegistro) {
          toast('Cuenta creada', 'success');
        }
        window.location.href = 'app/mi-dia.html';
      } finally {
        btnSubmit.disabled = false;
      }
    });
  </script>
</body>
</html>
